[project]
name = "xhs-agent-refactored"
version = "0.1.0"
description = "Refactored Xiaohongshu agent scaffold without LangChain."
readme = "README_refactored.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "openai>=1.45.0",
  "jieba>=0.42.1",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
norecursedirs = [
  ".git",
  ".venv",
  ".pytest_cache",
  "__pycache__",
  "pytest-cache-files-*",
]

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>采集结果 · 小红书助手</title>
  <link rel="stylesheet" href="/static/common.css" />
  <style>
    /* 手机端卡片视图 */
    @media (max-width: 640px) {
      .table-wrap { display: none; }
      .mobile-cards { display: block; }
    }
    @media (min-width: 641px) {
      .mobile-cards { display: none; }
    }
    .item-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px;
    }
    .item-card .item-title {
      font-size: 14px; font-weight: 500; margin-bottom: 6px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .item-card .item-meta {
      font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;
    }
    .item-card .item-tags { margin-bottom: 6px; }
    .item-card .item-link { font-size: 12px; }
    .stat-row {
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    .stat-num {
      font-size: 11px; color: var(--text-secondary); white-space: nowrap;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="topbar">
    <div>
      <h1>采集结果</h1>
      <p class="subtitle" id="statLabel">加载中…</p>
    </div>
    <a class="back-link" href="/static/crawl.html">← 返回采集</a>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">
    <button class="btn btn-success" id="feishuBtn">导入飞书</button>
    <button class="btn btn-primary" id="generateBtn">AI 生成笔记 →</button>
  </div>

  <!-- 移动端卡片 -->
  <div class="mobile-cards" id="mobileCards"></div>

  <!-- 桌面端表格 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>标题</th><th>作者</th>
          <th>评论</th><th>点赞</th><th>收藏</th>
          <th>发布时间</th><th>标签</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<div id="toast"></div>

<script>
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function toast(msg,ms){ ms=ms||2500; var t=document.getElementById('toast'); t.textContent=msg; t.className='show'; setTimeout(function(){t.className='';},ms); }

  var raw = localStorage.getItem('xhs_crawl_result');

  if (!raw) {
    document.getElementById('statLabel').textContent = '未找到采集数据，请先返回采集页运行采集。';
  } else {
    var data = JSON.parse(raw);
    document.getElementById('statLabel').textContent = '共 ' + data.count + ' 条笔记（目标 ' + data.target_count + ' 条）';

    // 桌面表格
    document.getElementById('tbody').innerHTML = (data.items || []).map(function(item, i){
      return '<tr>' +
        '<td>' + (i+1) + '</td>' +
        '<td><a href="' + esc(item.url) + '" target="_blank">' + esc(item.title) + '</a></td>' +
        '<td>' + esc(item.author||'-') + '</td>' +
        '<td class="num">' + (item.comments||0) + '</td>' +
        '<td class="num">' + (item.likes||0) + '</td>' +
        '<td class="num">' + (item.favorites||0) + '</td>' +
        '<td>' + esc(item.publish_time||'-') + '</td>' +
        '<td>' + (item.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('') + '</td>' +
        '</tr>';
    }).join('');

    // 移动端卡片
    document.getElementById('mobileCards').innerHTML = (data.items || []).map(function(item, i){
      return '<div class="item-card">' +
        '<div class="item-title">' + esc(item.title) + '</div>' +
        '<div class="item-meta">' + esc(item.author||'匿名') + ' · ' +
        '<span class="stat-num">' + (item.comments||0) + ' 评</span> ' +
        '<span class="stat-num">' + (item.likes||0) + ' 赞</span> ' +
        '<span class="stat-num">' + (item.favorites||0) + ' 藏</span> ' +
        '· ' + esc(item.publish_time||'-') +
        '</div>' +
        '<div class="item-tags">' + (item.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('') + '</div>' +
        '<a class="item-link" href="' + esc(item.url) + '" target="_blank">查看原文 →</a>' +
        '</div>';
    }).join('');
  }

  document.getElementById('feishuBtn').addEventListener('click', async function(){
    if (!data || !data.items || !data.items.length) { toast('没有数据可导入'); return; }
    this.disabled = true;
    this.textContent = '同步中…';
    try {
      var resp = await fetch('/feishu/sync-crawled', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ items: data.items }),
      });
      var result = await resp.json();
      toast(result.success ? '已导入飞书' : result.message, 3500);
    } catch(e) {
      toast('请求失败: ' + e.message, 3500);
    } finally {
      this.disabled = false;
      this.textContent = '导入飞书';
    }
  });

  document.getElementById('generateBtn').addEventListener('click', function(){
    window.location.href = '/static/generate.html';
  });
</script>
</body>
</html>

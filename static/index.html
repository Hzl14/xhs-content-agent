<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小红书内容 Agent</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --line: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #ff2442;
      --primary-dark: #e11d3a;
      --accent: #0f766e;
      --shadow: 0 18px 45px rgba(17,24,39,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .shell {
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr);
      gap: 18px;
      align-items: stretch;
    }
    .hero, .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .hero {
      padding: 34px;
      display: grid;
      align-content: center;
      gap: 20px;
    }
    .label {
      color: var(--accent);
      font-size: 13px;
      font-weight: 850;
    }
    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.12;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .btn.primary {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
    }
    .btn.primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn.secondary:hover { border-color: #cbd5e1; transform: translateY(-1px); }
    .panel {
      padding: 22px;
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .row {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #f9fafb;
    }
    .row strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
    .row span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    @media (max-width: 760px) {
      body { place-items: start; }
      .shell { grid-template-columns: 1fr; }
      .hero { padding: 24px; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <div class="label">XHS Content Agent</div>
        <h1>用对话完成小红书内容生产</h1>
      </div>
      <p>这个项目的核心不是采集工具，而是多轮内容 Agent：理解需求、必要时找素材、分析选题、生成文案、审核质量，并在发布前等待你确认。</p>
      <div class="actions">
        <a class="btn primary" href="/static/generate.html">进入对话工作台</a>
        <a class="btn secondary" href="/static/crawl.html">可选：采集素材</a>
      </div>
    </section>

    <aside class="panel">
      <div class="row">
        <strong>主入口是对话</strong>
        <span>用户可以连续说“帮我写一篇”“改真实一点”“确认发布”，系统沿用同一个 session/task。</span>
      </div>
      <div class="row">
        <strong>采集是内部步骤</strong>
        <span>当任务需要参考爆款或素材时，CrawlerAgent 才参与；它不是产品定位本身。</span>
      </div>
      <div class="row">
        <strong>发布前会暂停</strong>
        <span>即使用户要求发布，系统也会先生成草稿并等待确认，避免误发布。</span>
      </div>
    </aside>
  </main>
</body>
</html>
